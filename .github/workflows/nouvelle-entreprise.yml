# Installe Carte Clients pour une nouvelle entreprise cliente, depuis le téléphone :
# GitHub → Actions → « Nouvelle entreprise cliente » → Run workflow.
# Prérequis : le projet Supabase de l'entreprise est créé (région Europe), et le secret
# SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens) est enregistré dans GitHub.
name: Nouvelle entreprise cliente

on:
  workflow_dispatch:
    inputs:
      espace:
        description: "Nom court de l'espace (minuscules, chiffres, tirets), ex. boulangeries-martin"
        required: true
      entreprise:
        description: "Nom de l'entreprise affiché dans l'appli"
        required: true
      projet:
        description: "Référence du projet Supabase de l'entreprise (20 caractères)"
        required: true
      admin:
        description: "E-mail du premier administrateur chez le client"
        required: true

permissions:
  contents: write

concurrency:
  group: nouvelle-entreprise
  cancel-in-progress: false

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ESPACE: ${{ inputs.espace }}
      ENTREPRISE: ${{ inputs.entreprise }}
      PROJET: ${{ inputs.projet }}
      ADMIN: ${{ inputs.admin }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_EXPEDITEUR: ${{ secrets.SMTP_EXPEDITEUR }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les prérequis
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Ajoutez le secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."; exit 1
          fi

      - name: 1. Base de données et réglages de connexion
        run: python3 outils/nouvelle_entreprise.py base

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 2. Fonctions serveur (invitations, HubSpot, rendez-vous)
        run: |
          for f in inviter hubspot rdv; do
            supabase functions deploy "$f" --project-ref "$PROJET" --use-api
          done

      - name: 3. Espace de l'entreprise sur le site
        run: |
          python3 outils/nouvelle_entreprise.py espace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "entreprises/$ESPACE"
          if git diff --cached --quiet; then echo "Espace déjà à jour."; else
            git commit -m "Nouvelle entreprise cliente : $ENTREPRISE ($ESPACE)"
            git push
          fi

      - name: 4. Invitation du premier administrateur
        run: python3 outils/nouvelle_entreprise.py inviter

      - name: Résumé
        run: |
          {
            echo "## ✅ $ENTREPRISE est installée"
            echo "- Adresse de l'appli : $SITE/entreprises/$ESPACE/ (en ligne 1 à 2 minutes après la fin)"
            echo "- Invitation envoyée à **$ADMIN** : il choisit son mot de passe puis enregistre la double vérification."
            echo "- À faire si besoin : brancher HubSpot (secret HUBSPOT_TOKEN dans le projet Supabase de l'entreprise)."
          } >> "$GITHUB_STEP_SUMMARY"
